<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pizarra VaelWynne</title>
    <!-- Importamos la fuente Press Start 2P y Sacramento desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sacramento&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0d0610;
            color: #d1c2d4;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor de la Pizarra Estilo Videojuego */
        .vn-whiteboard-box {
            width: 100%;
            max-width: 650px;
            background: rgba(13, 6, 16, 0.95); 
            padding: 25px;
            border: 2px solid #ffb6c1;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .vn-whiteboard-box h2 {
            color: #ffb6c1;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Lienzo de dibujo */
        #paintCanvas {
            background-color: #fff9fc;
            border: 2px solid #ffb6c1;
            border-radius: 4px;
            cursor: crosshair;
            display: block;
            margin: 0 auto 15px auto;
            touch-action: none;
            max-width: 100%;
            height: auto;
        }

        /* Controles de la pizarra (paleta y botones) */
        .board-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .color-palette {
            display: flex;
            gap: 8px;
        }

        .color-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.2);
            border-color: #ffb6c1;
        }

        .tool-buttons {
            display: flex;
            gap: 10px;
        }

        .board-btn {
            background: #ffb6c1;
            border: none;
            color: #0d0610;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .board-btn:hover {
            background: #d84771;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Pizarra interactiva estilo minijuego -->
    <div class="vn-whiteboard-box">
        <h2>▸ Pizarra de Visitas (Deja tu dibujo)</h2>
        <canvas id="paintCanvas" width="600" height="300"></canvas>
        <div class="board-controls">
            <div class="color-palette">
                <div class="color-btn active" style="background-color: #1a1a1a;" data-color="#1a1a1a"></div>
                <div class="color-btn" style="background-color: #d84771;" data-color="#d84771"></div>
                <div class="color-btn" style="background-color: #ffb6c1;" data-color="#ffb6c1"></div>
                <div class="color-btn" style="background-color: #6a5acd;" data-color="#6a5acd"></div>
                <div class="color-btn" style="background-color: #4682b4;" data-color="#4682b4"></div>
            </div>
            <div class="tool-buttons">
                <button class="board-btn" id="eraserBtn">Borrador</button>
                <button class="board-btn" id="clearBtn">Limpiar</button>
                <button class="board-btn" id="sendBtn">Enviar dibujo</button>
            </div>
        </div>
    </div>

    <!-- Script de funcionamiento de la Pizarra -->
    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        function fillWhiteBackground() {
            ctx.fillStyle = '#fff9fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        fillWhiteBackground();

        let painting = false;
        let currentColor = '#1a1a1a';
        let currentWidth = 3;

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineWidth = currentWidth;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw);

        const colorBtns = document.querySelectorAll('.color-btn');
        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                colorBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
                currentWidth = 3;
            });
        });

        document.getElementById('eraserBtn').addEventListener('click', () => {
            currentColor = '#fff9fc';
            currentWidth = 12;
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            fillWhiteBackground();
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'mi-dibujo-vaelwynne.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            window.open('https://mindysuhq.tumblr.com/ask', '_blank');
        });
    </script>
</body>
</html>
