<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Atrapa el Té - VaelWynne</title>
    <!-- Importamos una fuente estilo lettering / cursiva moderna y limpia -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: transparent;
            color: #4a3b42;
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-box {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border: 2px solid #ffb6c1;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(216, 71, 113, 0.12);
            box-sizing: border-box;
            position: relative;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .game-box h2 {
            font-family: 'Pacifico', cursive;
            color: #d84771;
            font-size: 18px;
            margin: 0;
            font-weight: normal;
        }

        .pause-btn-top {
            background: #fff0f5;
            border: 2px solid #ffb6c1;
            color: #d84771;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pause-btn-top:hover {
            background: #ffb6c1;
            color: #fff;
        }

        .score-board {
            font-size: 12px;
            font-weight: 700;
            color: #8c737d;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-around;
        }

        canvas {
            background: #fff8fa;
            border: 3px solid #ffb6c1;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            touch-action: none;
        }

        /* Pantallas superpuestas */
        .overlay {
            position: absolute;
            top: 65px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: rgba(255, 245, 248, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            z-index: 10;
        }

        .overlay h3 {
            font-family: 'Pacifico', cursive;
            color: #d84771;
            font-size: 20px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: normal;
        }

        .overlay p {
            font-size: 12px;
            font-weight: 500;
            color: #6e4e5e;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
            padding: 0 15px;
        }

        .play-btn {
            background: #ffb6c1;
            border: none;
            color: #4a3b42;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 12px;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(216, 71, 113, 0.25);
        }

        .play-btn:hover {
            background: #d84771;
            color: #fff;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <div class="game-header">
            <h2>Atrapa el Té ~</h2>
            <button id="pauseGameBtn" class="pause-btn-top hidden">Pausa</button>
        </div>
        
        <div class="score-board">
            <span>Puntos: <span id="score">0</span></span>
            <span>Récord: <span id="highScore">0</span></span>
        </div>
        
        <!-- Canvas del juego -->
        <canvas id="gameCanvas" width="340" height="250"></canvas>

        <!-- Menú de Inicio -->
        <div id="startScreen" class="overlay">
            <h3>¡Hora del Té!</h3>
            <p>Atrapa las tacitas que caen y cuida tus 3 vidas. ¡Diviértete!</p>
            <button class="play-btn" id="startBtn">Jugar</button>
        </div>

        <!-- Menú de Pausa -->
        <div id="pauseScreen" class="overlay hidden">
            <h3>Pausa</h3>
            <p>Tómate un respiro con tu tacita ~</p>
            <button class="play-btn" id="resumeBtn">Continuar</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="gameOverScreen" class="overlay hidden">
            <h3 id="gameOverTitle">¡Oh no, se enfrió!</h3>
            <p>Puntuación final: <span id="finalScore">0</span></p>
            <button class="play-btn" id="restartBtn">Jugar otra vez</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');
        
        const startScreen = document.getElementById('startScreen');
        const pauseScreen = document.getElementById('pauseScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        
        const startBtn = document.getElementById('startBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const restartBtn = document.getElementById('restartBtn');
        const pauseGameBtn = document.getElementById('pauseGameBtn');

        let score = 0;
        let lives = 3;
        let highScore = localStorage.getItem('vaelTeaHighScore') || 0;
        highScoreElement.textContent = highScore;

        let gameState = 'START'; 

        const catcher = {
            x: canvas.width / 2 - 35,
            y: canvas.height - 32,
            width: 70,
            height: 22,
            speed: 7,
        };

        let items = [];

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
            if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
            if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (gameState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            catcher.x = touchX - catcher.width / 2;
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            catcher.x = mouseX - catcher.width / 2;
        });

        function startGame() {
            score = 0;
            lives = 3;
            items = [];
            scoreElement.textContent = score;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            pauseScreen.classList.add('hidden');
            pauseGameBtn.classList.remove('hidden');
            gameState = 'PLAYING';
        }

        function pauseGame() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseScreen.classList.remove('hidden');
                pauseGameBtn.textContent = 'Seguir';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseScreen.classList.add('hidden');
                pauseGameBtn.textContent = 'Pausa';
            }
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        resumeBtn.addEventListener('click', pauseGame);
        pauseGameBtn.addEventListener('click', pauseGame);

        function spawnItem() {
            if (gameState !== 'PLAYING') return;
            // 0: Tacita de té, 1: Corazoncito
            const type = Math.random() > 0.3 ? 0 : 1;
            const x = Math.random() * (canvas.width - 30);
            items.push({ x: x, y: -20, size: 24, speed: 2 + Math.random() * 2, type: type });
        }

        setInterval(spawnItem, 1000);

        function update() {
            if (gameState !== 'PLAYING') return;

            if (rightPressed && catcher.x < canvas.width - catcher.width) {
                catcher.x += catcher.speed;
            } else if (leftPressed && catcher.x > 0) {
                catcher.x -= catcher.speed;
            }

            if (catcher.x < 0) catcher.x = 0;
            if (catcher.x > canvas.width - catcher.width) catcher.x = canvas.width - catcher.width;

            for (let i = items.length - 1; i >= 0; i--) {
                items[i].y += items[i].speed;

                // Colisión con la cesta
                if (
                    items[i].y + items[i].size >= catcher.y &&
                    items[i].x + 15 >= catcher.x &&
                    items[i].x <= catcher.x + catcher.width
                ) {
                    score += 10;
                    scoreElement.textContent = score;
                    items.splice(i, 1);
                    continue;
                }

                // Si toca fondo (pierde vida)
                if (items[i].y > canvas.height) {
                    items.splice(i, 1);
                    lives--;
                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            pauseGameBtn.classList.add('hidden');
            finalScoreElement.textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('vaelTeaHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            gameOverScreen.classList.remove('hidden');
        }

        // Funciones auxiliares para dibujar elementos vectoriales hermosos
        function drawTeacup(x, y) {
            ctx.fillStyle = '#d84771';
            // Cuerpo de la taza
            ctx.beginPath();
            ctx.roundRect(x, y + 6, 20, 14, [0, 0, 8, 8]);
            ctx.fill();
            // Oreja de la taza
            ctx.strokeStyle = '#d84771';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x + 20, y + 11, 4, -Math.PI/2, Math.PI/2);
            ctx.stroke();
            // Vapor del té
            ctx.strokeStyle = '#ffb6c1';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x + 6, y + 2); ctx.quadraticCurveTo(x + 8, y - 2, x + 6, y - 5);
            ctx.moveTo(x + 14, y + 2); ctx.quadraticCurveTo(x + 16, y - 2, x + 14, y - 5);
            ctx.stroke();
        }

        function drawHeart(x, y) {
            ctx.fillStyle = '#ff6b8b';
            ctx.beginPath();
            let cx = x + 10;
            let cy = y + 10;
            ctx.arc(cx - 5, cy - 2, 5, Math.PI, 0, false);
            ctx.arc(cx + 5, cy - 2, 5, Math.PI, 0, false);
            ctx.lineTo(cx, cy + 8);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar Cesta (Taza grande o platito estético)
            ctx.fillStyle = '#ffb6c1';
            ctx.beginPath();
            ctx.roundRect(catcher.x, catcher.y, catcher.width, catcher.height, [6, 6, 12, 12]);
            ctx.fill();
            ctx.strokeStyle = '#d84771';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Ojitos de la cesta
            ctx.fillStyle = '#4a3b42';
            ctx.beginPath();
            ctx.arc(catcher.x + 22, catcher.y + 10, 2, 0, Math.PI * 2);
            ctx.arc(catcher.x + 48, catcher.y + 10, 2, 0, Math.PI * 2);
            ctx.fill();

            // Dibujar Vidas (Corazoncitos arriba a la izquierda)
            ctx.font = '11px "Quicksand"';
            ctx.fillStyle = '#8c737d';
            ctx.fillText('Vidas:', 10, 20);
            
            for (let i = 0; i < lives; i++) {
                drawHeart(52 + (i * 18), 7);
            }

            // Dibujar Objetos que caen (Tacitas o Corazones gráficos)
            for (let item of items) {
                if (item.type === 0) {
                    drawTeacup(item.x, item.y);
                } else {
                    drawHeart(item.x, item.y);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
