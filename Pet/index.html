<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VaelPet - Mascota Virtual</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #fff9fc;
            color: #1a1a1a;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .ouo-box {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border: 2px solid #ffb6c1;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(216, 71, 113, 0.15);
            box-sizing: border-box;
        }

        .ouo-box h2 {
            color: #d84771;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Contenedor de la carita */
        .face-container {
            position: relative;
            width: 170px;
            height: 110px;
            margin: 0 auto 20px auto;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff0f5;
            border: 3px solid #ffb6c1;
            border-radius: 45px;
            transition: transform 0.1s ease;
        }

        .face-container:active {
            transform: scale(0.90);
        }

        /* Expresión facial */
        .face {
            font-size: 34px;
            color: #1a1a1a;
            font-weight: bold;
            letter-spacing: 1px;
            transition: transform 0.1s;
        }

        /* Animación de mareo/temblor */
        .shaking {
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            25% { transform: translate(-2px, -2px) rotate(-3deg); }
            50% { transform: translate(2px, -2px) rotate(3deg); }
            75% { transform: translate(-2px, 2px) rotate(0deg); }
            100% { transform: translate(2px, 2px) rotate(0deg); }
        }

        /* Botones de acciones para celular y PC */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .action-btn {
            background: #ffb6c1;
            border: none;
            color: #0d0610;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 10px 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .action-btn:hover {
            background: #d84771;
            color: #fff;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* Texto de estado */
        .status-text {
            font-size: 9px;
            color: #8c737d;
            margin-top: 12px;
            height: 15px;
        }

        /* Corazoncitos o efectos flotantes */
        .effect-icon {
            position: absolute;
            color: #d84771;
            font-size: 14px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-45px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="ouo-box">
        <h2>▸ VaelPet (Mascota)</h2>
        
        <div class="face-container" id="petFace">
            <div class="face" id="expression">(>_<)</div>
        </div>

        <div class="status-text" id="statusMsg">¡Trata bien a tu VaelPet!</div>

        <!-- Botones ideales para celular y toque directo -->
        <div class="action-buttons">
            <button class="action-btn" id="btnPat">Acariciar 💖</button>
            <button class="action-btn" id="btnPinch">Apretar Cachetes 😤</button>
            <button class="action-btn" id="btnFeed">Dar Snack 🍡</button>
            <button class="action-btn" id="btnShake">Mover / Molestar 🌀</button>
        </div>
    </div>

    <script>
        const faceContainer = document.getElementById('petFace');
        const expression = document.getElementById('expression');
        const statusMsg = document.getElementById('statusMsg');

        // Diversas caritas estilo OUO
        const faces = {
            normal: '(>_<)',
            happy: '(๑>◡<๑)',
            pinch: '>(3)<',       // Estilo apretando cachetitos como en tu foto
            feed: '( ˘ ³˘)',      // Feliz comiendo
            dizzy: '( ◉ _ ◉ )',   // Mareado
            angry: '(-_-#)'       // Molesto
        };

        let timeoutId = null;

        function updateState(face, msg, effectSymbol = '♥') {
            clearTimeout(timeoutId);
            expression.textContent = face;
            statusMsg.textContent = msg;
            faceContainer.classList.remove('shaking');

            if (effectSymbol) {
                createEffect(effectSymbol);
            }

            // Regresa a la normalidad después de 2 segundos
            timeoutId = setTimeout(() => {
                expression.textContent = faces.normal;
                statusMsg.textContent = '¡Trata bien a tu VaelPet!';
                faceContainer.classList.remove('shaking');
            }, 2000);
        }

        // 1. Botón Acariciar
        document.getElementById('btnPat').addEventListener('click', () => {
            updateState(faces.happy, '¡A VaelPet le encantan tus mimos!', '💖');
        });

        // 2. Botón Apretar Cachetes (como en el dibujo)
        document.getElementById('btnPinch').addEventListener('click', () => {
            updateState(faces.pinch, '¡Ay! ¡Le aplastaste los cachetes!', '💢');
        });

        // 3. Botón Dar Snack
        document.getElementById('btnFeed').addEventListener('click', () => {
            updateState(faces.feed, '¡Mñam mñam! Qué rico snack 🍡', '🍡');
        });

        // 4. Botón Molestar / Marear
        document.getElementById('btnShake').addEventListener('click', () => {
            expression.textContent = faces.dizzy;
            statusMsg.textContent = '¡Uy, se mareó todo! 😵‍💫';
            faceContainer.classList.add('shaking');
            createEffect('🌀');

            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                expression.textContent = faces.normal;
                statusMsg.textContent = '¡Trata bien a tu VaelPet!';
                faceContainer.classList.remove('shaking');
            }, 2500);
        });

        // Toque directo en la carita también da amor por si usan el dedo en móvil
        faceContainer.addEventListener('click', () => {
            if (expression.textContent === faces.normal) {
                updateState(faces.happy, '¡Jeje, le hiciste cosquillas!', '✨');
            }
        });

        function createEffect(symbol) {
            const effect = document.createElement('div');
            effect.className = 'effect-icon';
            effect.textContent = symbol;
            
            const x = (Math.random() * 80) - 40;
            effect.style.left = `calc(50% + ${x}px)`;
            effect.style.top = '30px';
            
            faceContainer.appendChild(effect);
            setTimeout(() => effect.remove(), 800);
        }
    </script>
</body>
</html>
